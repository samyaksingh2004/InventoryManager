<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/js/bootstrap.min.js"></script>

    <style>
      .hidden-display {
        display: none;
      }

      .btn-group-sm>.btn,
      .btn-sm {
        padding: .25rem .5rem;
        font-size: .875rem;
        line-height: 1.5;
        border-radius: .2rem;
      }

      .action-buttons {
        display: flex;
        gap: 0.25rem;
        align-items: center;
      }

      .action-buttons > .btn{
        margin:0;
      }
    </style>

    <script>
      document.addEventListener('DOMContentLoaded', function () {

        document.querySelectorAll(".editQuantity").forEach(function (button) {
          button.addEventListener('click', function () {
            var row = this.closest('tr');
            var quantityRow = row.querySelector(".quantityRow");
            var requestedRow = row.querySelector(".requestedRow")
            var editForm = row.querySelector(".editForm");
            quantityRow.classList.add("hidden-display");
            requestedRow.classList.add("hidden-display");
            editForm.classList.remove("hidden-display");
          });
        });
        document.querySelectorAll(".editFormSubmit").forEach(function (button) {
          button.addEventListener('click', function () {
            var row = this.closest('tr');
            var quantityRow = row.querySelector(".quantityRow");
             var requestedRow = row.querySelector(".requestedRow")
            var editForm = row.querySelector(".editForm");
            quantityRow.classList.remove("hidden-display");
             requestedRow.classList.remove("hidden-display");
            editForm.classList.add("hidden-display");
          });
        });

        function filterOptions(inputId, optionsId) {
          var input = document.getElementById(inputId);
          var filter = input.value.toUpperCase();
          var options = document.getElementById(optionsId).options;

          for (var i = 0; i < options.length; i++) {
            var option = options[i];
            if (option.value.toUpperCase().indexOf(filter) > -1) {
              option.style.display = '';
            } else {
              option.style.display = 'none';
            }
          }
        }

        document.getElementById('nameInput').addEventListener('input', function() {
          filterOptions('nameInput', 'nameOptions');
        });
        document.getElementById('newItemName').addEventListener('input', function() {
          filterOptions('newItemName', 'nameOptions');
        });


        $(document).on('click', '.edit-item-name-btn', function () {
          var itemId = $(this).data('item-id');
          $('#editItemId').val(itemId);
          // Show the modal
          $('#editItemNameModal').modal('show');
        });
      });
    </script>
  </head>

  <body>
    <div th:insert="~{navbar :: navbar}"></div>

    <div class="container">
      <h3>Select a Category</h3>
      <form action="/selectCategory" method="post" class="form-inline">
        <div class="form-group">
          <select class="form-control" name="name">
            <option th:each="category : ${categories}" th:value="${category.name}"
              th:text="${category.name}"></option>
          </select>
        </div>
        <button type="submit" class="btn btn-primary">Enter</button>
      </form>
    </div>

    <div class="container" id="newCategoryButton" style="margin-top: 20px;">
      <form action="/newcategory" method="post" class="form-inline">
        <div class="form-group">
          <label for="newCategory">Enter New Category:</label>
          <input type="text" id="newCategory" class="form-control" placeholder="New Category" name="name" required>
        </div>
        <button type="submit" class="btn btn-success">Submit</button>
      </form>
    </div>

    <div class="container" style="margin-top: 20px;">
      <h3 th:text="${selectedCategory}" style="text-align: center;"></h3>
      <table class="table table-striped" id="categoryItemList">
        <thead>
          <tr>
            <th>Item</th>
            <th>Requested</th>
            <th>Given</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <form action="/newCategoryItem" method="post" class="form-inline">
              <input type="hidden" name="category" th:value="${selectedCategory}">
              <td>
                <input type="text" id="nameInput" class="form-control" placeholder="Enter name and unit"
                   required list="nameOptions" name="itemKey">
                <datalist id="nameOptions">
                  <option th:each="item : ${items}" th:value="${item.itemKey}"></option>
                </datalist>
              </td>
              <td><input type="number" class="form-control" placeholder="Amount Requested" name="requested"
                  required></td>
              <td><input type="number" class="form-control" value=0 name="given" required></td>
              <td><button type="submit" class="btn btn-primary">Add Item</button></td>
            </form>
          </tr>
          <tr th:each="categoryItem : ${categoryItems}">
            <td th:text="${inventoryItemMap[categoryItem.itemId]?.itemKey}"></td>
            <td th:text="${categoryItem.requested}" class = "requestedRow"></td>
            <td th:text="${categoryItem.given}" class="quantityRow"></td>
            <td class="editForm hidden-display">
              <form action="/newCategoryItem" method="post" class="form-inline">
                <input type="hidden" th:value="${selectedCategory}" name="category">
                <input type="hidden" th:value="${inventoryItemMap[categoryItem.itemId]?.itemKey}"
                  name="itemKey" />
                   <div class="form-group">
                      <input type="number" th:value="${categoryItem.requested}" name="requested" class="form-control"
                         required>
                    </div>
                    <div class="form-group">
                        <input type="number" th:value="${categoryItem.given}" name="given" class="form-control"
                            required>
                    </div>
                <button type="submit" class="btn btn-success editFormSubmit">✅</button>
              </form>
            </td>
             <td class="changeName hidden-display">
                <form action="/editItemName" method="post" class="form-inline">
                   <input type="hidden" name="itemId" th:value="${categoryItem.itemId}" />
                    <input type="hidden" name="category"  th:value="${selectedCategory}"/>
                    <input type="text" name="newName" placeholder="Enter new name" class="form-control"
                      required list = "nameOptions"/>
                    <button type="submit" class="btn btn-warning">Save</button>
                </form>
              </td>
            <td>
              <div class = "action-buttons">
                <!-- Edit Name Button -->
                <button type="button" class="btn btn-primary btn-sm edit-item-name-btn" data-toggle="modal"
                  data-target="#editItemNameModal" th:data-item-id="${categoryItem.itemId}"
                  th:data-category-key="${categoryItem.categoryKey}">Edit Name</button>

                <!-- Delete and Quantity Form -->
                 <form action="/deleteCategoryItem" method="post" class="form-inline" style ="display: inline-block">
                  <input type="hidden" th:value="${inventoryItemMap[categoryItem.itemId]?.itemKey}"
                    name="itemKey" />
                  <input type="hidden" th:value="${selectedCategory}" name="category" />
                  <button type="submit" class="btn btn-danger btn-sm">⛔</button>
                 </form>
                <button type="button" class="btn btn-warning btn-sm editQuantity">✏️</button>
              </div>
            </td>
          </tr>

        </tbody>
      </table>
    </div>

    <!-- Modal for editing item name -->
    <div class="modal fade" id="editItemNameModal" tabindex="-1" role="dialog"
      aria-labelledby="editItemNameModalLabel" aria-hidden="true">
      <div class="modal-dialog" role="document">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="editItemNameModalLabel">Edit Item Name</h5>
            <button type="button" class="close" data-dismiss="modal" aria-label="Close">
              <span aria-hidden="true">×</span>
            </button>
          </div>
          <div class="modal-body">
            <form action="/editItemName" method="post">
              <input type="hidden" name="itemId" id="editItemId" />
               <input type="hidden" name="category"  th:value="${selectedCategory}"/>
              <div class="form-group">
                <label for="newItemName">New Item Name:</label>
                <input type="text" class="form-control" id="newItemName" name="newName" required list ="nameOptions">
              </div>
              <button type="submit" class="btn btn-primary">Save changes</button>
            </form>
          </div>
        </div>
      </div>
    </div>
  </body>

</html>
